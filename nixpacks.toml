providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build:docker"]

[start]
cmd = "NODE_ENV=production node ./scripts/src/docker-start.mjs"
