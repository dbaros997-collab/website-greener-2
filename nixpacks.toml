# Coolify / Nixpacks — native pnpm monorepo build.
# package.json "packageManager" selects pnpm 11; pnpm-workspace.yaml defines the workspace.
# Nixpacks' default pnpm (9.x) cannot read pnpm 11 lockfile overrides — activate corepack first.
# Do NOT set NODE_ENV=production globally: pnpm skips devDependencies (Vite/esbuild) needed to build.

providers = ["node"]

[phases.install]
cmds = [
  "npm install -g corepack@latest",
  "corepack enable",
  "corepack prepare pnpm@11.10.0 --activate",
  "pnpm install --frozen-lockfile --prod=false",
]

[phases.build]
cmds = ["pnpm run build:docker"]

[start]
cmd = "NODE_ENV=production node ./scripts/src/docker-start.mjs"
